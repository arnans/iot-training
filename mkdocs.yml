site_name: IoT ในฟาร์มอัจฉริยะ
site_description: ใบงานสำหรับผู้เข้าร่วม - IoT Systems in Smart Farming

docs_dir: docs
copyright: เอกสารนี้เรียบเรียงขึ้นด้วย AI (Fable 5.1 และ GPT-6 Astra) ภายใต้การกำกับอย่างใกล้ชิดของผู้จัดทำ และรับรองว่าเนื้อหาเป็นไปตามเจตนาของผู้จัดทำทุกประการ   # AI disclosure, shown in the site footer; the renders carry the same line
site_dir: site

# index.html is the published site's front door, hand-written for GitHub Pages.
# MkDocs renders index.md to the same destination, so keep it out of the preview build.
exclude_docs: |
  index.html
  superpowers/

theme:
  name: material
  language: th
  icon:
    logo: material/sprout
  font:
    text: Prompt
    code: IBM Plex Mono
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: โหมดมืด
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: โหมดสว่าง

nav:
  - เริ่มต้นที่นี่: index.md
  - เตรียมแล็ปท็อปก่อนวันอบรม: install.md
  # the nav ends at activity 7; the record sheet, menu reference and file list are reached
  # from the front page (index.md, docs/index.html) so the course structure stays readable
  - "ช่วงที่ 1 — รับรู้ ตัดสินใจ สั่งการ":
      - เตรียมพร้อมก่อนเริ่ม: session-1-start.md
      - "กิจกรรม 1 · อ่านค่าเซนเซอร์ (Sense)": activity-1.md
      - "กิจกรรม 2 · ต่อวงจรและสั่งงานหลอดไฟ (Act)": activity-2.md
      - "กิจกรรม 3 · สร้างกฎควบคุมระบบ (Logic)": activity-3.md
  - "ช่วงที่ 2 — ควบคุมอัตโนมัติและ Fail-safe":
      - "กิจกรรม 4 · ตั้งกฎอัตโนมัติ (Think)": activity-4.md
      - "กิจกรรม 5 · จำลองปัญหาและป้องกัน (Failure lab)": activity-5.md
  - "ช่วงที่ 3 — แดชบอร์ดและออกแบบระบบ":
      - "กิจกรรม 6 · อ่านข้อมูลย้อนหลัง (History)": activity-6.md
      - "กิจกรรม 7 · สร้างแดชบอร์ด (Dashboard)": activity-7.md
      - "กิจกรรม 8 · ออกแบบระบบฟาร์ม (Design)": activity-8.md

hooks:
  - hooks/fields.py   # {{f:key}} markers -> form fields, see webapp/FILLABLE-WORKSHEET.md
  - hooks/steps.py    # seed the CSS step counter so numbering continues past action-group breaks
  - hooks/headings.py # "4.4" at the start of a sub-activity heading becomes a badge
  - hooks/callouts.py # cautions (bold ระวัง/ห้าม) and phase labels get a class to colour
  - hooks/videos.py   # image syntax pointing at an .mp4 -> looping walkthrough <video>

plugins:
  - search
  - glightbox:
      manual: true   # only links carrying the glightbox class open a popup; ordinary images stay inline
      touchNavigation: true
      zoomable: true
      effect: zoom

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true   # extra.js remembers ticks per page
