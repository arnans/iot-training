# ESP32-C6-Relay_X1 v1.1 — WORKSHOP image
#
# Same provisioning strategy as the sensor node: one source file built once per
# zone by build-zones.py, zone colour in the hostname (gogo-relay-red-a1b2c3),
# adopted in Home Assistant as <name>.local.
#
# Pin assignments confirmed from the vendor datasheet — see ESP32-C6-RELAY-X1.md.
#
# POWER: the board takes 7-60V DC on the screw terminal OR 5V over USB-C,
# "choose one" per the datasheet. In the workshop it runs from the charge
# controller's LOAD pair; USB is used once, to read the device name, and must be
# unplugged before the 12V is connected.

substitutions:
  device_base_name: gogo-relay
  # Overridden per build by build-zones.py; defaults only so `esphome config` validates.
  zone: red
  wifi_ssid: farm-iot-red
  wifi_password: SET_BY_BUILD_SCRIPT
  relay_pin: GPIO19        # confirmed: relay control, active high
  led_pin: GPIO2           # confirmed: programmable LED, active high — now the WiFi status LED
  button_pin: GPIO9        # confirmed: programmable button, also the BOOT key

esphome:
  name: ${device_base_name}-${zone}
  name_add_mac_suffix: true
  # No friendly_name: with ~60 identical boards, the unique hostname is what lets
  # a team find theirs in Home Assistant.
  # See gogo-iot-workshop.yaml: print the name as one unmistakable INFO line at
  # boot, rather than raising the whole logger to CONFIG to surface it.
  on_boot:
    then:
      - logger.log:
          format: "================================================"
          level: INFO
      - logger.log:
          format: "=====  DEVICE NAME: %s  ====="
          args: ["App.get_name().c_str()"]
          level: INFO
      - logger.log:
          format: "================================================"
          level: INFO

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  # WORKSHOP: no encryption key — see gogo-iot-workshop.yaml and firmware/README.md.
  # Critical here: the relay board sits on the 12V rail overnight with no Home
  # Assistant connected. At the 15min default it would reboot all night.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  # WORKSHOP: ESPHome defaults ESP32 to power_save_mode: light, where the radio
  # sleeps between beacons and only wakes on DTIM to collect buffered broadcast
  # and multicast. mDNS is multicast, so in a room with 200 boards and heavy
  # broadcast that is exactly the traffic most likely to be missed — and missing
  # it means `<name>.local` intermittently fails to resolve. These boards run on
  # mains power via the charge controller, so there is nothing to save.
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: ${device_base_name}-${zone}-setup
    password: !secret fallback_ap_password

captive_portal:
improv_serial:

# WORKSHOP: see gogo-iot-workshop.yaml for the reasoning. `local: true` is
# mandatory — the default UI pulls its JavaScript from a CDN and sessions 1-2
# have no internet, so the page would render blank.
web_server:
  port: 80
  local: true

# WORKSHOP: diagnostics. Uptime matters most on this board — it sits on the 12V
# rail overnight with no Home Assistant connected, which is exactly the case
# reboot_timeout: 0s exists to handle. TEST-PLAN test F checks it here.
sensor:
  - platform: uptime
    name: "เวลาทำงาน (uptime)"
    id: uptime_s
    update_interval: 60s
    entity_category: diagnostic
  - platform: wifi_signal
    name: "ความแรงสัญญาณ WiFi"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "หมายเลข IP"
      id: ip_addr
      entity_category: diagnostic
      # WORKSHOP: see gogo-iot-workshop.yaml — the IP cannot be printed at
      # on_boot because WiFi has not associated yet, so it is logged here when
      # the sensor first publishes.
      on_value:
        - logger.log:
            format: "=====  IP ADDRESS: %s  ====="
            args: ["x.c_str()"]
            level: INFO

switch:
  - platform: gpio
    name: "รีเลย์ (relay)"
    pin: ${relay_pin}
    id: relay
    # Safety: after a power cut or reboot the pump must not come back on by itself.
    restore_mode: ALWAYS_OFF

# WORKSHOP: the programmable LED shows WIFI CONNECTION STATUS, not relay state.
# It used to mirror the relay, but the relay's own hard-wired indicator already
# lights from the coil an inch away, so mirroring it bought nothing. A team can
# now answer "is my board on the network?" from the board itself, with no laptop
# and no Home Assistant. With ~100 teams in one room, that is the support
# question that matters most.
#
# Session 2's worksheet still holds: it tells teams the LED on the relay board
# stands in for the garden lamp, and the relay's OWN indicator still lights
# whenever the relay closes. Only the programmable LED changed jobs.
#
# The grammar, chosen so the healthy state is the VISIBLE one:
#   steady lit = on WiFi
#   blinking   = WiFi lost, board is trying to reconnect
#   dark       = no power, or firmware not running
# Dark-when-healthy (the ESPHome default) would make "fine" and "dead" look
# identical — the wrong answer to the question a team actually asks. Lit-when-
# healthy also lets an instructor read the room from the front: dark board = go
# help that table.
#
# WHY NOT `status_led:` — bench-proven, do not "simplify" this back.
# `status_led:` drives the pin itself: 250 ms on / 1250 ms off for a warning
# (esphome/components/status_led/status_led.cpp). Inverting the pin to get
# lit-when-healthy inverts THAT TOO, leaving the LED lit 83% of the time with a
# 250 ms wink — which on the bench read as "stayed lit, never blinked" when
# walking out of WiFi range. The blink has to be driven explicitly to be seen.
#
# WiFi only, deliberately: `status_led:` also counts "no Home Assistant client"
# as a fault, but the relay board is DESIGNED to sit on 12 V overnight with no HA
# (see reboot_timeout: 0s and TEST-PLAN test F). Including the API here would
# have ~100 boards blinking all night for a condition that is normal.
output:
  - platform: gpio
    pin: ${led_pin}          # active high — no inversion; the blink is ours now
    id: led_out

light:
  - platform: binary
    id: status_light
    output: led_out
    internal: true           # not an HA entity, so nothing fights the interval
    restore_mode: ALWAYS_OFF

interval:
  - interval: 400ms          # 0.8 s blink period — readable across a room
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on: status_light
          else:
            - light.toggle: status_light

# Onboard button toggles the relay: a hardware manual override that works even when
# Home Assistant is unreachable. Worth demonstrating in session 2 next to the
# Auto/Off/Manual control box, as the same idea one layer down.
#
# GPIO9 is the ESP32-C6 boot strapping pin. Momentary presses during normal running
# are harmless; only holding it while power is applied enters download mode.
binary_sensor:
  - platform: gpio
    name: "ปุ่มบนบอร์ด (button)"
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - switch.toggle: relay
