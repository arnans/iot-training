# ESP32-C6 single-channel relay board — WORKSHOP image
#
# Same provisioning strategy as the sensor node: one image, unique hostname from
# name_add_mac_suffix, adopted in Home Assistant as <name>.local.
#
# Powered from the charge controller's LOAD pair (7-60V DC input), NOT from a
# laptop USB port. USB is only used once, to read the board's name.

substitutions:
  device_base_name: gogo-relay
  # CONFIRM ON THE BENCH — see TEST-PLAN.md test H.
  # The ESP32 Relay X1 family (WROOM) uses GPIO16 for the relay and GPIO23 for the
  # status LED, but this is the ESP32-C6 v1.1 board and the C6 has a different pin
  # map. Find the real pins before the workshop:
  #   1. Vendor listing / wiki for esp32-c6-relay-x1-v1.1
  #   2. Or flash with the relay pin commented out, then toggle candidate GPIOs
  #      from the ESPHome web console and listen for the click.
  relay_pin: GPIO16
  led_pin: GPIO23
  button_pin: GPIO9        # C6 boot strapping pin, usually the onboard button

esphome:
  name: ${device_base_name}
  name_add_mac_suffix: true

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Critical here: the relay board sits on the 12V rail overnight with no Home
  # Assistant connected. At the 15min default it would reboot all night.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: ${device_base_name}-setup
    password: !secret fallback_ap_password

captive_portal:
improv_serial:

switch:
  - platform: gpio
    name: "รีเลย์"
    pin: ${relay_pin}
    id: relay
    # Safety: after a power cut or reboot the pump must not come back on by itself.
    restore_mode: ALWAYS_OFF

# Onboard button toggles the relay — a hardware manual override that works even if
# Home Assistant is unreachable. Worth demonstrating in session 2 alongside the
# Auto/Off/Manual control box.
binary_sensor:
  - platform: gpio
    name: "ปุ่มบนบอร์ด"
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - switch.toggle: relay

# Status LED follows the relay so the "lamp" in the session 2 flower-farm scenario
# is visible. If the board's LED is hard-wired to the relay coil, delete this block.
output:
  - platform: gpio
    pin: ${led_pin}
    id: led_output

light:
  - platform: binary
    name: "ไฟแสดงสถานะ"
    output: led_output
    internal: true
