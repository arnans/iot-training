# Copy to secrets.yaml and fill in. secrets.yaml is gitignored.
#
# WiFi credentials are NOT here any more. They are per zone, in zones.yaml (copy
# zones.example.yaml); build-zones.py injects them at compile time.
#
# No api_encryption_key: the ESPHome API runs unencrypted on purpose, so adoption
# in Home Assistant needs only the hostname, not a key to copy from a team card.
# See firmware/README.md for the tradeoff.

ota_password: "OPTIONAL_BUT_SET_IT"

# Used by the fallback hotspot each board raises if the workshop SSID is missing.
fallback_ap_password: "AT_LEAST_8_CHARS"
