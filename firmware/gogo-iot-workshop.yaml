# GoGo-IoT sensor node — WORKSHOP image
#
# ONE source file, THREE builds. The room is split into three logical zones (red,
# green, blue), each its own WiFi SSID and VLAN. build-zones.py compiles this file
# once per zone with `esphome -s zone red -s wifi_ssid ... -s wifi_password ...`,
# so the zone and its credentials are baked in without maintaining three YAMLs.
#
# Within a zone, uniqueness comes from name_add_mac_suffix, and the zone is part
# of the hostname so a board announces where it belongs:
#     gogo-iot-red  ->  gogo-iot-red-a1b2c3
#
# Participants read that name over USB at web.esphome.io, check the colour matches
# their table, then add the device in Home Assistant as <name>.local — no static
# IPs, no MAC reservations, no stickers.
#
# Derived from gogo-iot-node.github/gogo-iot-node/firmware/gogo-iot-node.yaml
# (bring-up config). Differences from that file are marked  # WORKSHOP:

substitutions:
  device_base_name: gogo-iot

  # --- Zone. These three are OVERRIDDEN per build by build-zones.py. ---
  # The defaults exist only so `esphome config` validates standalone.
  zone: red
  wifi_ssid: farm-iot-red
  wifi_password: SET_BY_BUILD_SCRIPT

  # --- Vibration reporter tuning (see "Vibration" at the bottom of this file) ---
  # Sampling period for the accelerometer. 25ms = 40Hz.
  vib_sample_interval: 25ms
  # How often the RMS figure is published to Home Assistant.
  vib_report_interval: 1s
  # Hysteresis thresholds in milli-g, CALIBRATE THESE against the real pump.
  # Same idea the workshop teaches in session 2: separate on and off thresholds
  # so the reading does not flap when it sits near the line.
  vib_on_threshold: "25"
  vib_off_threshold: "12"

esphome:
  name: ${device_base_name}-${zone}
  # WORKSHOP: unique hostname per board. The zone colour sits in the name on
  # purpose — it is the cross-zone check at the name-reading step. Do not remove.
  name_add_mac_suffix: true
  # WORKSHOP: friendly_name deliberately omitted. With it set, all 60 boards would
  # appear in Home Assistant as the same human-readable name and teams could not
  # tell them apart. Without it, HA shows the unique hostname, and teams rename
  # the device to their own team name after adding it.
  # WORKSHOP: print the name as one unmistakable INFO line at boot, rather than
  # raising the whole logger to CONFIG just to surface it buried among every
  # other component's config dump. This is the line participants read at
  # web.esphome.io. See TEST-PLAN.md test B.
  on_boot:
    then:
      - logger.log:
          format: "================================================"
          level: INFO
      - logger.log:
          format: "=====  DEVICE NAME: %s  ====="
          args: ["App.get_name().c_str()"]
          level: INFO
      - logger.log:
          format: "================================================"
          level: INFO

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# ESP32-C3 native USB Serial/JTAG (IO18/IO19 -> USB-C D-/D+); this board has no
# USB-UART bridge. This is also the port improv_serial and web.esphome.io use.
logger:
  hardware_uart: USB_SERIAL_JTAG
  # WORKSHOP: bring-up used VERBOSE, which floods once illuminance runs at 1s.
  # INFO keeps the log quiet. The device name is NOT printed by anything at
  # INFO by default (bench-tested: it's only in WiFi's config dump, which is
  # tagged CONFIG — one level up, filtered out here) so it's logged
  # explicitly below via on_boot, instead of raising the whole log level.
  level: INFO

api:
  # WORKSHOP: no encryption key. Simplicity for adoption beats API confidentiality
  # on an isolated per-zone workshop network — see firmware/README.md.
  # WORKSHOP: default is 15min — with no Home Assistant connected overnight the
  # board would reboot every 15 minutes, punching gaps in the session-2 history.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # WORKSHOP: from substitutions, not !secret, so build-zones.py can set them per
  # zone on the command line. Credentials live in zones.yaml (gitignored).
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  # WORKSHOP: ESPHome defaults ESP32 to power_save_mode: light, where the radio
  # sleeps between beacons and only wakes on DTIM to collect buffered broadcast
  # and multicast. mDNS is multicast, so in a room with 200 boards and heavy
  # broadcast that is exactly the traffic most likely to be missed — and missing
  # it means `<name>.local` intermittently fails to resolve. These boards run on
  # mains power via the charge controller, so there is nothing to save.
  power_save_mode: none
  # WORKSHOP: default is 15min; same reasoning as api.reboot_timeout. If the AP
  # blips at 03:00 we want a retry, not a reboot loop.
  reboot_timeout: 0s
  # WORKSHOP: fallback hotspot if the baked-in SSID is not found. Together with
  # captive_portal this lets a board be re-provisioned from a phone at a future
  # workshop or at a participant's home, without reflashing.
  ap:
    ssid: ${device_base_name}-${zone}-setup
    password: !secret fallback_ap_password

captive_portal:

# WORKSHOP: set WiFi over the USB cable from a browser (web.esphome.io, Chrome
# or Edge). Not needed when the SSID is baked in, but it is the escape hatch and
# costs nothing.
improv_serial:

# WORKSHOP: the board serves its own page at http://<board-ip>/ with live values
# and switch controls. Three jobs:
#   1. First fifteen minutes — teams see temperature and light react to a hand
#      before any Home Assistant exists.
#   2. Support fallback — proves the board is alive and sensing when a team's HA
#      is broken. Same reasoning as the relay board's status LED.
#   3. Session 3 ("open the network box") — "your board IS a web server on the
#      network, here is its address" beats any diagram.
#
# `local: true` is MANDATORY, not a preference: the default web UI fetches its
# JavaScript from a CDN, and sessions 1-2 run with no internet at all, so the
# page would come up blank. This embeds the assets in flash instead — it is the
# part that costs binary size, so watch the build.
web_server:
  port: 80
  local: true

# Verified from PCB connectivity review: SDA -> GPIO8, SCL -> GPIO2
i2c:
  sda: GPIO8
  scl: GPIO2
  scan: true
  frequency: 100kHz

# 0x23 BH1750FVI-TR   illuminance
# 0x44 GXHT30C        temperature + humidity (SHT3x-compatible)
# 0x6A LSM6DS3TR-C    6-axis IMU
# 0x77 SPA06-003      pressure + temperature
sensor:
  - platform: bh1750
    name: "ความสว่าง (light)"
    address: 0x23
    # WORKSHOP: 1s, not the 5s used by the others. Session 2 teaches hysteresis by
    # making the relay chatter while a hand hovers at the threshold. At 5s the
    # chattering is invisible and the lesson fails. See TEST-PLAN.md test E.
    update_interval: 1s

  - platform: sht3xd
    address: 0x44
    update_interval: 5s
    temperature:
      name: "อุณหภูมิ (temperature)"
    humidity:
      name: "ความชื้นอากาศ (humidity)"

  - platform: spa06_i2c
    address: 0x77
    update_interval: 5s
    pressure:
      name: "ความกดอากาศ (pressure)"
    temperature:
      name: "อุณหภูมิ (pressure sensor)"
      # WORKSHOP: a second temperature entity confuses teams reading the entity
      # list. Kept but hidden from the default dashboard.
      internal: true

  - platform: lsm6ds
    name: "อุณหภูมิ (IMU)"
    internal: true

  # Raw axes. Internal: they exist only to drive the accumulator below.
  # Declaration order matters — the accumulator hangs off the last one, by which
  # point x and y have already been updated in the same listener pass.
  - platform: motion
    type: acceleration_x
    id: accel_x
    internal: true
  - platform: motion
    type: acceleration_y
    id: accel_y
    internal: true
  - platform: motion
    type: acceleration_z
    id: accel_z
    internal: true
    on_value:
      then:
        - lambda: |-
            // The lambda parameter `x` is this sensor's new value, i.e. the z
            // axis. Do not name locals x/y/z here — they would shadow it.
            const float ax = id(accel_x).state;
            const float ay = id(accel_y).state;
            const float az = x;
            if (!(ax == ax && ay == ay && az == az)) return;   // NaN guard

            const float mag = sqrtf(ax*ax + ay*ay + az*az);

            // Slow baseline: ~2s time constant at 40Hz. Tracks gravity and any
            // re-orientation, but not the vibration we are trying to measure.
            id(vib_baseline) += 0.0125f * (mag - id(vib_baseline));

            const float dev = mag - id(vib_baseline);
            id(vib_sumsq) += (double) dev * dev;
            id(vib_count) += 1;

  # WORKSHOP: diagnostics. Uptime is how TEST-PLAN test F proves the board did
  # not reboot overnight — without it there is nothing to check. WiFi signal is
  # the first thing to look at when a board keeps going unavailable in the room.
  - platform: uptime
    name: "เวลาทำงาน (uptime)"
    id: uptime_s
    update_interval: 60s
    entity_category: diagnostic
  - platform: wifi_signal
    name: "ความแรงสัญญาณ WiFi"
    update_interval: 60s
    entity_category: diagnostic

  # Published metric: RMS deviation over the report window, in milli-g.
  - platform: template
    name: "ความสั่นสะเทือน (vibration)"
    id: vibration_rms
    unit_of_measurement: "mg"
    accuracy_decimals: 1
    state_class: measurement
    icon: "mdi:vibrate"
    update_interval: ${vib_report_interval}
    lambda: |-
      if (id(vib_count) < 2) return {};
      const double rms = sqrt(id(vib_sumsq) / id(vib_count));
      id(vib_sumsq) = 0;
      id(vib_count) = 0;
      return (float) (rms * 1000.0f);   // g -> milli-g

motion:
  - platform: lsm6ds
    address: 0x6A
    # WORKSHOP: was 5s. The vibration reporter below needs a fast sample stream;
    # this is the poll rate that feeds it. The chip's own ODR stays at 104Hz.
    update_interval: ${vib_sample_interval}
    accelerometer_range: 4G
    accelerometer_odr: 104HZ
    gyroscope_range: 2000DPS
    # WORKSHOP: gyro unused; save the bus and the power.
    # Quoted, or YAML reads bare OFF as boolean false.
    gyroscope_odr: "OFF"

# ============================================================================
# Vibration reporter
# ----------------------------------------------------------------------------
# Answers "is the pump ACTUALLY running?" rather than "did we command it on?".
# A relay can be closed while the pump is seized, unprimed or unplugged, and
# nothing else in the kit would notice. This is the commanded-state versus
# actual-state distinction that session 2's fail-safe block is built around.
#
# Algorithm follows gogo-iot-node/docs/ESPHOME_PLAN.md:
#   1. sample acceleration fast (40Hz here; chip ODR is 104Hz)
#   2. take the magnitude, so mounting orientation does not matter
#   3. subtract a slow baseline, which removes gravity and any tilt
#   4. RMS the remainder over a 1s window
#   5. threshold with hysteresis and persistence
#
# Deliberately NOT streaming raw acceleration to Home Assistant: the three axis
# sensors below are internal, and only the 1s RMS figure and the binary verdict
# are published.
#
# Note on sampling: vibration above 20Hz aliases down at a 40Hz poll rate. For a
# yes/no "is it running" verdict that is harmless — aliased energy still shows up
# as variance. Do not read the RMS figure as a calibrated vibration measurement.
# ============================================================================

# WORKSHOP: the board's own IP, visible in Home Assistant. Useful to the
# instructor when a team's `.local` lookup fails and they need the fallback.
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "หมายเลข IP"
      id: ip_addr
      entity_category: diagnostic
      # WORKSHOP: second half of the boot banner. The IP cannot be printed from
      # on_boot — WiFi has not associated yet and there is no address to print.
      # Logging it here, when the sensor first publishes, guarantees the value
      # exists, and re-prints it if DHCP ever hands out a different one.
      # This is the address for the web_server page above.
      on_value:
        - logger.log:
            format: "=====  IP ADDRESS: %s  ====="
            args: ["x.c_str()"]
            level: INFO

globals:
  - id: vib_baseline          # slow-moving magnitude, i.e. gravity + tilt
    type: float
    restore_value: false
    initial_value: '1.0'      # acceleration is in g, so at rest magnitude is ~1
  - id: vib_sumsq
    type: double
    restore_value: false
    initial_value: '0'
  - id: vib_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: vib_running           # holds the hysteresis state
    type: bool
    restore_value: false
    initial_value: 'false'

binary_sensor:
  # The verdict. Hysteresis in the lambda, persistence in the filters — the same
  # two ideas teams apply by hand in session 2, here done in firmware.
  - platform: template
    name: "ปั๊มกำลังทำงาน (pump running)"
    id: pump_running
    icon: "mdi:water-pump"
    lambda: |-
      const float v = id(vibration_rms).state;
      if (!(v == v)) return {};                 // no reading yet
      if (id(vib_running)) {
        if (v < ${vib_off_threshold}) id(vib_running) = false;
      } else {
        if (v > ${vib_on_threshold}) id(vib_running) = true;
      }
      return id(vib_running);
    filters:
      - delayed_on: 2s        # ignore a knock on the table
      - delayed_off: 5s       # ride through a brief dip

  # WORKSHOP: float switch on configurable port 1. CONFIRMED ON THE BENCH.
  # Netlist (docs/SCHEMATIC_REFERENCE.md): SPECIALPORT1-A = CN2.1 = U1.12[IO0]
  #                                        SPECIALPORT1-B = CN2.2 = U1.13[IO1]
  # Neither is a strapping pin on the ESP32-C3 (those are IO2, IO8, IO9), so a
  # switch to ground here is safe at boot. GPIO0 confirmed correct — the switch
  # does move this pin.
  #
  # Wiring: the float switch has two bare wire ends. They land on the OUTER two
  # positions (Signal, Ground) of the adapter's 4-way terminal block; a Grove
  # cable runs from the adapter to SPECIAL PORT 1 on the board.
  #
  # Polarity, measured: the float closes the switch when DOWN (dry) and opens it
  # when it RISES (wet). Open + internal pull-up = pin HIGH when wet, so
  # `inverted: false` gives ON = water present.
  #
  # There is no external pull-up anywhere on the switch or the adapter — the
  # chip's internal one (~45k, weak) does the whole job. See TEST-PLAN.md test G.
  #
  # FAIL-SAFE WARNING: a cut wire or unseated Grove plug also leaves the pin
  # pulled HIGH, which is indistinguishable from "water present". A fault reads
  # as safe-to-pump. Session 2's fail-safe must require positive confirmation of
  # water and treat unavailable/unknown as dry — inverting the entity does not
  # change this, it is a property of which way the float closes.
  - platform: gpio
    name: "สวิตช์ลูกลอย (float switch)"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: false     # open (wet) reads HIGH -> ON = water present
    filters:
      - delayed_on: 500ms
      - delayed_off: 500ms   # mechanical float bounces on a moving water surface
