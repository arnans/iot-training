 {id:"ov-12", t:"ปิด", target:90, pts:[
   "กลับบ้าน: <b>HA ที่ใช้ได้บนแล็ปท็อป</b> · ใบบันทึกกลุ่ม · แบบร่างมีราคา · คู่มือ+แหล่งเรียนรู้ — และคำถามก่อนซื้อของทุกชิ้น",
   "เริ่มที่ฟาร์ม: หนึ่งจุด · ตรวจสเปก/ราคาก่อนซื้อ · เครื่องบันทึกมีไฟ+เน็ตตลอด",
   "<b>เตรียมก่อนวันแรก</b>: (1) แล็ปท็อป 1/กลุ่ม ติดตั้ง VirtualBox + นำเข้า HA · ส่งภาพยืนยัน<b>ก่อน 3 วัน</b> (2) มือถือต่อ WiFi (3) <b>ปัญหาฟาร์มหนึ่งประโยค</b> ยังไม่ต้องคิดวิธีแก้",
   "ปิด: <b>“เจอกัน 25 กันยายน — มาพร้อมแล็ปท็อปที่พร้อมและปัญหาหนึ่งข้อ ที่เหลือทำด้วยกันในห้อง”</b>"]},
];
let i = 0, t0 = Date.now(), tick;
const $ = id => document.getElementById(id);
function fmt(s){return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");}
function show(){
  const s = SEGS[i];
  $("seg").textContent = s.id;
  $("title").textContent = " · " + s.t;
  $("target").textContent = "เป้า ~" + fmt(s.target);
  const demo = /DEMO/.test(s.t);
  $("points").innerHTML = s.pts.map(p=>"<li"+(demo?' class="demo"':"")+">"+p+"</li>").join("");
  $("pos").textContent = (i+1) + " / " + SEGS.length;
  t0 = Date.now();
}
function timer(){
  const el = (Date.now()-t0)/1000, tg = SEGS[i].target;
  $("timer").textContent = fmt(el);
  $("timer").className = el > tg ? "over" : el > tg*0.8 ? "warn" : "ok";
}
document.addEventListener("keydown", e=>{
  if(e.key===" "||e.key==="ArrowRight"){ if(i<SEGS.length-1){i++;show();} e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ if(i>0){i--;show();} }
  else if(e.key==="r"||e.key==="R"){ t0 = Date.now(); }
});
document.addEventListener("click", ()=>{ if(i<SEGS.length-1){i++;show();} });
show(); tick = setInterval(timer, 250);
</script>
</body>
</html>
