# ESP32-C6-Relay_X1 v1.1 — WORKSHOP image
#
# Same provisioning strategy as the sensor node: one image, unique hostname from
# name_add_mac_suffix, adopted in Home Assistant as <name>.local.
#
# Pin assignments confirmed from the vendor datasheet — see ESP32-C6-RELAY-X1.md.
#
# POWER: the board takes 7-60V DC on the screw terminal OR 5V over USB-C,
# "choose one" per the datasheet. In the workshop it runs from the charge
# controller's LOAD pair; USB is used once, to read the device name, and must be
# unplugged before the 12V is connected.

substitutions:
  device_base_name: gogo-relay
  relay_pin: GPIO19        # confirmed: relay control, active high
  led_pin: GPIO2           # confirmed: programmable LED, active high
  button_pin: GPIO9        # confirmed: programmable button, also the BOOT key

esphome:
  name: ${device_base_name}
  name_add_mac_suffix: true
  # No friendly_name: with ~60 identical boards, the unique hostname is what lets
  # a team find theirs in Home Assistant.

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Critical here: the relay board sits on the 12V rail overnight with no Home
  # Assistant connected. At the 15min default it would reboot all night.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # WORKSHOP: ESPHome defaults ESP32 to power_save_mode: light, where the radio
  # sleeps between beacons and only wakes on DTIM to collect buffered broadcast
  # and multicast. mDNS is multicast, so in a room with 200 boards and heavy
  # broadcast that is exactly the traffic most likely to be missed — and missing
  # it means `<name>.local` intermittently fails to resolve. These boards run on
  # mains power via the charge controller, so there is nothing to save.
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: ${device_base_name}-setup
    password: !secret fallback_ap_password

captive_portal:
improv_serial:

# WORKSHOP: diagnostics. Uptime matters most on this board — it sits on the 12V
# rail overnight with no Home Assistant connected, which is exactly the case
# reboot_timeout: 0s exists to handle. TEST-PLAN test F checks it here.
sensor:
  - platform: uptime
    name: "เวลาทำงาน (uptime)"
    id: uptime_s
    update_interval: 60s
    entity_category: diagnostic
  - platform: wifi_signal
    name: "ความแรงสัญญาณ WiFi"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "หมายเลข IP"
      entity_category: diagnostic

switch:
  - platform: gpio
    name: "รีเลย์ (relay)"
    pin: ${relay_pin}
    id: relay
    # Safety: after a power cut or reboot the pump must not come back on by itself.
    restore_mode: ALWAYS_OFF
    # The board's own relay indicator LED is hard-wired to the coil and lights on
    # its own. We drive the programmable LED in step with it as well, so the
    # "lamp" in the session 2 flower-farm scenario is visible across the room.
    on_turn_on:
      - output.turn_on: led_output
    on_turn_off:
      - output.turn_off: led_output

output:
  - platform: gpio
    pin: ${led_pin}
    id: led_output

# Onboard button toggles the relay: a hardware manual override that works even when
# Home Assistant is unreachable. Worth demonstrating in session 2 next to the
# Auto/Off/Manual control box, as the same idea one layer down.
#
# GPIO9 is the ESP32-C6 boot strapping pin. Momentary presses during normal running
# are harmless; only holding it while power is applied enters download mode.
binary_sensor:
  - platform: gpio
    name: "ปุ่มบนบอร์ด (button)"
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - switch.toggle: relay
