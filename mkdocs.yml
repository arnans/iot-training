site_name: IoT ในฟาร์มอัจฉริยะ
site_description: ใบงานสำหรับผู้เข้าร่วม - IoT Systems in Smart Farming

docs_dir: docs
site_dir: site

# index.html is the published site's front door, hand-written for GitHub Pages.
# MkDocs renders index.md to the same destination, so keep it out of the preview build.
exclude_docs: |
  index.html
  superpowers/

theme:
  name: material
  language: th
  icon:
    logo: material/sprout
  font:
    text: Prompt
    code: IBM Plex Mono
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: โหมดมืด
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: โหมดสว่าง

nav:
  - เริ่มต้นที่นี่: index.md
  - เตรียมแล็ปท็อปก่อนการอบรม: install.md
  - "ช่วงที่ 1 — รับรู้ ตัดสินใจ สั่งการ":
      - เตรียมพร้อมก่อนเริ่ม: session-1-start.md
      - "กิจกรรมที่ 1 — รู้จักและทดลองอ่านค่าเซนเซอร์ (Sense)": activity-1.md
      - "กิจกรรมที่ 2 — ต่อวงจรและสั่งงานหลอดไฟ (Act)": activity-2.md
      - "กิจกรรมที่ 3 — สร้างกฎควบคุมระบบ (Logic)": activity-3.md
  - "ช่วงที่ 2 — ควบคุมอัตโนมัติและ Fail-safe":
      - "กิจกรรมที่ 4 — ตั้งกฎให้ระบบทำงานอัตโนมัติ (Think)": activity-4.md
      - "กิจกรรมที่ 5 — จำลองปัญหาและเพิ่มระบบป้องกัน (Failure lab)": activity-5.md
  - "ช่วงที่ 3 — แดชบอร์ดและออกแบบระบบ":
      - การอ่านข้อมูลที่บันทึกไว้ย้อนหลัง: session-3-history.md
      - "กิจกรรมที่ 6 — สร้างหน้าจอติดตามและควบคุมฟาร์ม (Dashboard)": activity-6.md
      - "กิจกรรมที่ 7 — ออกแบบระบบสำหรับฟาร์ม (Design)": activity-7.md
  - ใบบันทึกของกลุ่ม: record-sheet.md
  - เมนูและวิธีแก้ปัญหา: reference.md
  - รวมไฟล์และลิงก์: resources.md

hooks:
  - hooks/fields.py   # {{f:key}} markers -> form fields, see webapp/FILLABLE-WORKSHEET.md
  - hooks/steps.py    # seed the CSS step counter so numbering continues past action-group breaks

plugins:
  - search
  - glightbox:
      manual: true   # only links carrying the glightbox class open a popup; ordinary images stay inline
      touchNavigation: true
      zoomable: true
      effect: zoom

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true   # extra.js remembers ticks per page
