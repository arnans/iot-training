site_name: IoT ในฟาร์มอัจฉริยะ
site_description: ใบงานสำหรับผู้เข้าร่วม - IoT Systems in Smart Farming

docs_dir: docs
site_dir: site

# index.html is the published site's front door, hand-written for GitHub Pages.
# MkDocs renders index.md to the same destination, so keep it out of the preview build.
exclude_docs: |
  index.html

theme:
  name: material
  language: th
  icon:
    logo: material/sprout
  font:
    text: Prompt
    code: IBM Plex Mono
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: โหมดมืด
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: โหมดสว่าง

nav:
  - เริ่มต้นที่นี่: index.md
  - เตรียมแล็ปท็อปก่อนการอบรม: install.md
  - "ช่วงที่ 1 — ระบบสมองกลฝังตัวในฟาร์ม: รับรู้ ตัดสินใจ สั่งการ": session-1.md
  - "ช่วงที่ 2 — ตรรกะควบคุมอัตโนมัติและการออกแบบ Fail-safe สำหรับฟาร์ม": session-2.md
  - "ช่วงที่ 3 — โครงสร้างระบบ IoT: การสื่อสาร คลาวด์ แดชบอร์ด และการออกแบบระบบ": session-3.md
  - ใบบันทึกของกลุ่ม: record-sheet.md
  - เมนูและวิธีแก้ปัญหา: reference.md
  - รวมไฟล์และลิงก์: resources.md

hooks:
  - hooks/fields.py   # {{f:key}} markers -> form fields, see webapp/FILLABLE-WORKSHEET.md

plugins:
  - search
  - glightbox:
      manual: true   # only links carrying the glightbox class open a popup; ordinary images stay inline
      touchNavigation: true
      zoomable: true
      effect: zoom

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true   # extra.js remembers ticks per page
