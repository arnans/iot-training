# Copy to zones.yaml and fill in. zones.yaml is gitignored.
#
# Three zones, one GL.iNet Flint router each, with its own 2.4 GHz SSID (boards) and 5 GHz
# SSID (laptops). Team kits are colour-coded to match. See network/NETWORK-SETUP.md.
#
# These SSIDs and passwords are compiled into 200 boards and CANNOT change on the
# day. They must be final one week before the workshop.
#
# Keep passwords short and unambiguous (avoid l/1/I/O/0): a participant may need to
# type one at web.esphome.io if a board has to be re-provisioned in the room.

red:
  ssid: farm-iot-red
  password: CHANGE_ME
green:
  ssid: farm-iot-green
  password: CHANGE_ME
blue:
  ssid: farm-iot-blue
  password: CHANGE_ME
